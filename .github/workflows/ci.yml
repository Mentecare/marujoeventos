name: EventCore CI

on:
  push:
    branches: [main, feature/eventcore-aligned-flows-20261005]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install PyMuPDF==1.26.6
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:18765
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-public
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GOOGLE_OAUTH_STATE_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
          GOOGLE_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_APP_URL: https://example.vercel.app
      - run: npm run typecheck
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/pdf-deployment-trace.mjs
      - run: node tests/quote-pdf.integration.mjs
        env:
          EVENTCORE_PDF_SERVER_MODE: production
      - run: node tests/aligned-flows.browser.mjs
      - run: node tests/notifications.integration.mjs
