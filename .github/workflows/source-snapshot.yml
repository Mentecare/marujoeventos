name: EventCore Source Snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: contains(github.event.head_commit.message, '[source-snapshot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tracked source snapshot
        run: |
          mkdir -p /tmp/eventcore-source
          git archive HEAD | tar -x -C /tmp/eventcore-source
      - uses: actions/upload-artifact@v4
        with:
          name: eventcore-source-snapshot
          path: /tmp/eventcore-source
          include-hidden-files: true
          retention-days: 1
